# Deploy the static site (index.html, diagram.html, report.html, the demo, and assets)
# to GitHub Pages. The prostate component bundle is already committed at
# demo/prostate-mri-map.bundle.js, so this workflow does not need a Deno build.
#
# In the repository settings, set Pages → Build and deployment → Source
# to "GitHub Actions" once. Pushes to main then publish the site.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site/demo/data _site/assets
          cp index.html diagram.html report.html LICENSE _site/
          cp -a assets/. _site/assets/
          cp demo/index.html demo/prostate-map.svg demo/prostate-map-2.svg \
            demo/prostate-mri-map.bundle.js _site/demo/
          cp demo/data/*.json _site/demo/data/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
